# Uso:  docker compose run --rm --build app
#   1) levanta PostgreSQL + pgvector y espera a que esté listo
#   2) 'ingesta' procesa el PDF y guarda los embeddings (solo trabaja lo que falte)
#   3) 'app' abre el chat de preguntas
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ingesta:
    build: .
    image: rag-constitucion
    command: sh -c "python -m src.procesar && python -m src.ingesta"
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    image: rag-constitucion
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    volumes:
      - ./data:/app/data
    depends_on:
      ingesta:
        condition: service_completed_successfully
    stdin_open: true
    tty: true
    profiles: ["app"]

volumes:
  pgdata: